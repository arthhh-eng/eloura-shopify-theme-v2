name: Patch eloura cookie and first-order popup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply isolated popup implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          snippet = r'''{% liquid
  assign privacy_url = '/policies/privacy-policy'
  if shop.privacy_policy
    assign privacy_url = shop.privacy_policy.url
  endif
%}

{% unless request.design_mode %}
  <div class="eloura-consent" data-eloura-consent hidden>
    <div class="eloura-consent__panel" data-eloura-consent-dialog role="dialog" aria-modal="true" aria-labelledby="ElouraConsentTitle" tabindex="-1">
      <p class="eloura-modal__eyebrow" id="ElouraConsentTitle">{{ 'eloura_privacy_offer.cookies.heading' | t }}</p>
      <p class="eloura-consent__copy">{{ 'eloura_privacy_offer.cookies.copy' | t }}</p>
      <div class="eloura-consent__actions">
        <button class="eloura-modal__button eloura-modal__button--dark" type="button" data-consent-accept>{{ 'eloura_privacy_offer.cookies.accept_all' | t }}</button>
        <button class="eloura-modal__button" type="button" data-consent-reject>{{ 'eloura_privacy_offer.cookies.reject_nonessential' | t }}</button>
      </div>
      <a class="eloura-modal__policy" href="{{ privacy_url }}">{{ 'eloura_privacy_offer.cookies.privacy_policy' | t }}</a>
    </div>
  </div>

  {% if settings.enable_first_order_popup %}
    <div class="eloura-offer" data-eloura-offer hidden>
      <button class="eloura-offer__backdrop" type="button" data-offer-close aria-label="{{ 'eloura_privacy_offer.offer.close' | t }}"></button>
      <div class="eloura-offer__panel" data-eloura-offer-dialog role="dialog" aria-modal="true" aria-labelledby="ElouraOfferTitle" tabindex="-1">
        <button class="eloura-offer__close" type="button" data-offer-close aria-label="{{ 'eloura_privacy_offer.offer.close' | t }}">×</button>
        <p class="eloura-modal__eyebrow" id="ElouraOfferTitle">{{ 'eloura_privacy_offer.offer.heading' | t }}</p>
        <p class="eloura-offer__copy">{{ 'eloura_privacy_offer.offer.copy' | t }}</p>
        <div class="eloura-offer__code-wrap">
          <span>{{ 'eloura_privacy_offer.offer.promo_label' | t }}</span>
          <strong>eloura10</strong>
        </div>
        <button class="eloura-modal__button eloura-modal__button--dark" type="button" data-copy-code data-copy-label="{{ 'eloura_privacy_offer.offer.copy_code' | t | escape }}" data-copied-label="{{ 'eloura_privacy_offer.offer.copied' | t | escape }}">{{ 'eloura_privacy_offer.offer.copy_code' | t }}</button>
        <button class="eloura-offer__continue" type="button" data-offer-close>{{ 'eloura_privacy_offer.offer.continue' | t }}</button>
      </div>
    </div>
  {% endif %}
{% endunless %}
'''

          css = r'''body.eloura-modal-open{overflow:hidden}.eloura-consent,.eloura-offer{position:fixed;inset:0;z-index:2147480000;font:inherit;color:#0a0a0a}.eloura-consent[hidden],.eloura-offer[hidden]{display:none!important}.eloura-consent{display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(10,10,10,.32)}.eloura-consent__panel,.eloura-offer__panel{box-sizing:border-box;background:#faf9f6;color:#0a0a0a;border:1px solid rgba(10,10,10,.14);box-shadow:0 22px 70px rgba(0,0,0,.20)}.eloura-consent__panel{width:min(720px,100%);padding:26px;border-radius:20px}.eloura-modal__eyebrow{margin:0 0 12px;font-size:11px;line-height:1.4;letter-spacing:.16em;text-transform:uppercase}.eloura-consent__copy,.eloura-offer__copy{margin:0;color:#636363;font-size:14px;line-height:1.58}.eloura-consent__actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.eloura-modal__button{appearance:none;min-height:50px;border:1px solid #0a0a0a;border-radius:999px;background:#faf9f6;color:#0a0a0a;padding:11px 18px;font:inherit;font-size:11px;line-height:1.2;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.eloura-modal__button--dark{background:#0a0a0a;color:#fff}.eloura-modal__button:focus-visible,.eloura-modal__policy:focus-visible,.eloura-offer__close:focus-visible,.eloura-offer__continue:focus-visible,.eloura-offer__backdrop:focus-visible{outline:2px solid #0a0a0a;outline-offset:3px}.eloura-modal__policy{display:inline-block;margin-top:17px;color:#0a0a0a;border-bottom:1px solid currentColor;font-size:10px;line-height:1.5;letter-spacing:.09em;text-decoration:none;text-transform:uppercase}.eloura-offer{display:grid;place-items:center;padding:20px}.eloura-offer__backdrop{position:absolute;inset:0;border:0;background:rgba(10,10,10,.46);cursor:default}.eloura-offer__panel{position:relative;width:min(440px,100%);max-height:calc(100svh - 40px);overflow:auto;padding:32px;border-radius:22px;animation:elouraModalIn .24s ease both}.eloura-offer__close{position:absolute;top:10px;right:12px;width:44px;height:44px;border:0;background:transparent;color:#0a0a0a;font:inherit;font-size:28px;line-height:1;cursor:pointer}.eloura-offer__code-wrap{margin:22px 0 0;padding:17px 18px;border:1px solid rgba(10,10,10,.16);border-radius:15px;background:rgba(255,255,255,.48)}.eloura-offer__code-wrap span{display:block;margin-bottom:6px;color:#6a6a6a;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.eloura-offer__code-wrap strong{display:block;font-size:29px;line-height:1.1;font-weight:500;letter-spacing:.03em}.eloura-offer .eloura-modal__button{width:100%;margin-top:18px}.eloura-offer__continue{display:block;margin:15px auto 0;border:0;border-bottom:1px solid currentColor;background:transparent;color:#0a0a0a;padding:4px 0;font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}@keyframes elouraModalIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}@media(max-width:520px){.eloura-consent{padding:10px}.eloura-consent__panel{padding:21px 16px 18px;border-radius:18px}.eloura-consent__actions{grid-template-columns:1fr;gap:9px}.eloura-offer{padding:14px}.eloura-offer__panel{max-height:calc(100svh - 28px);padding:29px 20px 22px;border-radius:19px}.eloura-offer__code-wrap strong{font-size:25px}}@media(prefers-reduced-motion:reduce){.eloura-offer__panel{animation:none}}
'''

          js = r'''(() => {
  const consentRoot = document.querySelector('[data-eloura-consent]');
  const consentDialog = document.querySelector('[data-eloura-consent-dialog]');
  const offerRoot = document.querySelector('[data-eloura-offer]');
  const offerDialog = document.querySelector('[data-eloura-offer-dialog]');
  const offerKey = 'eloura:first-order-offer:v2';
  const offerDays = 30;
  let activeRoot = null;
  let activeDialog = null;
  let returnFocus = null;

  const focusable = (root) => [...root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter((el) => !el.hidden && el.offsetParent !== null);
  const lock = () => document.body.classList.add('eloura-modal-open');
  const unlock = () => { if (!activeRoot) document.body.classList.remove('eloura-modal-open'); };
  const openModal = (root, dialog) => {
    if (!root || !dialog) return;
    returnFocus = document.activeElement;
    activeRoot = root;
    activeDialog = dialog;
    root.hidden = false;
    lock();
    requestAnimationFrame(() => dialog.focus());
  };
  const closeModal = (root) => {
    if (!root) return;
    root.hidden = true;
    if (activeRoot === root) {
      activeRoot = null;
      activeDialog = null;
    }
    unlock();
    if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
    returnFocus = null;
  };
  const offerWasSeen = () => {
    try {
      if (sessionStorage.getItem(offerKey)) return true;
      const stored = Number(localStorage.getItem(offerKey) || 0);
      return stored > Date.now() - offerDays * 86400000;
    } catch (_) { return false; }
  };
  const markOfferSeen = () => {
    try {
      sessionStorage.setItem(offerKey, '1');
      localStorage.setItem(offerKey, String(Date.now()));
    } catch (_) {}
  };
  const showOffer = () => {
    if (!offerRoot || offerWasSeen()) return;
    markOfferSeen();
    window.setTimeout(() => openModal(offerRoot, offerDialog), 220);
  };
  const loadConsentApi = (callback) => {
    if (window.Shopify?.customerPrivacy?.setTrackingConsent) return callback();
    if (!window.Shopify?.loadFeatures) return callback(new Error('Shopify Customer Privacy API unavailable'));
    window.Shopify.loadFeatures([{ name: 'consent-tracking-api', version: '0.1' }], callback);
  };
  const needsConsent = () => {
    const privacy = window.Shopify?.customerPrivacy;
    if (!privacy) return true;
    if (typeof privacy.currentVisitorConsent === 'function') {
      const current = privacy.currentVisitorConsent();
      if (current && ['analytics', 'marketing', 'preferences'].some((key) => current[key] === '')) return true;
      if (current && ['analytics', 'marketing', 'preferences'].every((key) => current[key] === 'yes' || current[key] === 'no')) return false;
    }
    if (typeof privacy.shouldShowBanner === 'function') return privacy.shouldShowBanner();
    return true;
  };
  const saveConsent = (accepted) => {
    const privacy = window.Shopify?.customerPrivacy;
    if (!privacy?.setTrackingConsent) return;
    const consent = accepted
      ? { analytics: true, marketing: true, preferences: true }
      : { analytics: false, marketing: false, preferences: false };
    privacy.setTrackingConsent(consent, (error) => {
      if (error) {
        console.warn('[eloura] Consent choice was not saved by Shopify.', error);
        return;
      }
      closeModal(consentRoot);
      showOffer();
    });
  };

  consentRoot?.querySelector('[data-consent-accept]')?.addEventListener('click', () => saveConsent(true));
  consentRoot?.querySelector('[data-consent-reject]')?.addEventListener('click', () => saveConsent(false));
  offerRoot?.querySelectorAll('[data-offer-close]').forEach((button) => button.addEventListener('click', () => closeModal(offerRoot)));
  offerRoot?.querySelector('[data-copy-code]')?.addEventListener('click', async (event) => {
    const button = event.currentTarget;
    try {
      await navigator.clipboard.writeText('eloura10');
    } catch (_) {
      const input = document.createElement('textarea');
      input.value = 'eloura10';
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      input.remove();
    }
    button.textContent = button.dataset.copiedLabel;
    window.setTimeout(() => { button.textContent = button.dataset.copyLabel; }, 1600);
  });

  document.addEventListener('keydown', (event) => {
    if (!activeRoot) return;
    if (event.key === 'Escape' && activeRoot === offerRoot) {
      event.preventDefault();
      closeModal(offerRoot);
      return;
    }
    if (event.key !== 'Tab') return;
    const items = focusable(activeRoot);
    if (!items.length) {
      event.preventDefault();
      activeDialog?.focus();
      return;
    }
    const first = items[0];
    const last = items[items.length - 1];
    const focused = document.activeElement;
    if (!activeRoot.contains(focused)) {
      event.preventDefault();
      (event.shiftKey ? last : first).focus();
    } else if (event.shiftKey && (focused === first || focused === activeDialog)) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && focused === last) {
      event.preventDefault();
      first.focus();
    }
  });

  loadConsentApi((error) => {
    if (error || !window.Shopify?.customerPrivacy) {
      console.warn('[eloura] Shopify Customer Privacy API could not be initialized; the promotional popup is withheld to preserve consent ordering.');
      return;
    }
    if (needsConsent()) openModal(consentRoot, consentDialog);
    else showOffer();
  });
})();
'''

          Path('snippets/privacy-offer-modals.liquid').write_text(snippet, encoding='utf-8')
          Path('assets/privacy-offer.css').write_text(css, encoding='utf-8')
          Path('assets/privacy-offer.js').write_text(js, encoding='utf-8')

          theme_path = Path('layout/theme.liquid')
          theme = theme_path.read_text(encoding='utf-8')
          css_line = "    {{ 'privacy-offer.css' | asset_url | stylesheet_tag }}\n"
          if "'privacy-offer.css'" not in theme:
              anchor = "    {%- render 'stylesheets' -%}\n"
              if anchor not in theme:
                  raise RuntimeError('Could not find stylesheets anchor in layout/theme.liquid')
              theme = theme.replace(anchor, anchor + css_line, 1)
          if "render 'privacy-offer-modals'" not in theme:
              anchor = "  </body>"
              insertion = "    {% render 'privacy-offer-modals' %}\n    <script src=\"{{ 'privacy-offer.js' | asset_url }}\" defer=\"defer\"></script>\n"
              if anchor not in theme:
                  raise RuntimeError('Could not find body closing tag in layout/theme.liquid')
              theme = theme.replace(anchor, insertion + anchor, 1)
          theme_path.write_text(theme, encoding='utf-8')

          settings_path = Path('config/settings_schema.json')
          settings_text = settings_path.read_text(encoding='utf-8')
          settings = json.loads(settings_text)
          if not any(any(s.get('id') == 'enable_first_order_popup' for s in group.get('settings', [])) for group in settings if isinstance(group, dict)):
              settings.append({
                  'name': 'eloura. popup',
                  'settings': [
                      {
                          'type': 'checkbox',
                          'id': 'enable_first_order_popup',
                          'default': True,
                          'label': 'Enable first-order 10% popup'
                      }
                  ]
              })
              settings_path.write_text(json.dumps(settings, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          translations = {
              'locales/bg.json': {
                  'cookies': {
                      'heading': 'НАСТРОЙКИ ЗА БИСКВИТКИ',
                      'copy': 'Използваме задължителни бисквитки, за да работи магазинът. С ваше съгласие можем да използваме и незадължителни бисквитки за анализи, предпочитания и маркетинг.',
                      'accept_all': 'ПРИЕМАМ ВСИЧКИ',
                      'reject_nonessential': 'ОТКАЗВАМ НЕЗАДЪЛЖИТЕЛНИТЕ',
                      'privacy_policy': 'ПОЛИТИКА ЗА ПОВЕРИТЕЛНОСТ'
                  },
                  'offer': {
                      'heading': 'ПЪРВА ПОРЪЧКА',
                      'copy': 'Получете 10% отстъпка при първата си поръчка.',
                      'promo_label': 'ПРОМОКОД',
                      'copy_code': 'КОПИРАЙ КОДА',
                      'copied': 'КОПИРАНО',
                      'continue': 'ПРОДЪЛЖИ ПАЗАРУВАНЕТО',
                      'close': 'Затвори офертата'
                  }
              },
              'locales/en.default.json': {
                  'cookies': {
                      'heading': 'COOKIE PREFERENCES',
                      'copy': 'We use essential cookies to run the store. With your permission, we may also use non-essential cookies for analytics, preferences and marketing.',
                      'accept_all': 'ACCEPT ALL',
                      'reject_nonessential': 'REJECT NON-ESSENTIAL',
                      'privacy_policy': 'PRIVACY POLICY'
                  },
                  'offer': {
                      'heading': 'FIRST ORDER',
                      'copy': 'Get 10% off your first purchase.',
                      'promo_label': 'PROMO CODE',
                      'copy_code': 'COPY CODE',
                      'copied': 'COPIED',
                      'continue': 'CONTINUE SHOPPING',
                      'close': 'Close offer'
                  }
              },
              'locales/ru.json': {
                  'cookies': {
                      'heading': 'НАСТРОЙКИ COOKIE',
                      'copy': 'Мы используем обязательные файлы cookie для работы магазина. С вашего согласия мы также можем использовать необязательные cookie для аналитики, предпочтений и маркетинга.',
                      'accept_all': 'ПРИНЯТЬ ВСЕ',
                      'reject_nonessential': 'ОТКЛОНИТЬ НЕОБЯЗАТЕЛЬНЫЕ',
                      'privacy_policy': 'ПОЛИТИКА КОНФИДЕНЦИАЛЬНОСТИ'
                  },
                  'offer': {
                      'heading': 'ПЕРВАЯ ПОКУПКА',
                      'copy': 'Получите скидку 10% на первую покупку.',
                      'promo_label': 'ПРОМОКОД',
                      'copy_code': 'СКОПИРОВАТЬ КОД',
                      'copied': 'СКОПИРОВАНО',
                      'continue': 'ПРОДОЛЖИТЬ ПОКУПКИ',
                      'close': 'Закрыть предложение'
                  }
              }
          }

          for filename, values in translations.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if '"eloura_privacy_offer"' in text:
                  continue
              pos = text.rfind('\n}')
              if pos == -1:
                  raise RuntimeError(f'Could not find root closing brace in {filename}')
              block = json.dumps({'eloura_privacy_offer': values}, ensure_ascii=False, indent=2)
              inner = block[2:-2]
              updated = text[:pos] + ',\n  ' + inner.replace('\n', '\n  ') + text[pos:]
              parsed = json.loads(updated)
              if parsed.get('eloura_privacy_offer') != values:
                  raise RuntimeError(f'Locale validation failed for {filename}')
              path.write_text(updated, encoding='utf-8')

          # Validate all touched JSON after patching.
          json.loads(Path('config/settings_schema.json').read_text(encoding='utf-8'))
          for filename in translations:
              json.loads(Path(filename).read_text(encoding='utf-8'))
          PY

          git diff --check
          git status --short
          git rm .github/workflows/eloura-cookie-popup-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/privacy-offer.css assets/privacy-offer.js snippets/privacy-offer-modals.liquid layout/theme.liquid config/settings_schema.json locales/bg.json locales/en.default.json locales/ru.json
          git commit -m "Add cookie consent and first-order popup to active V2 theme"
          git push origin HEAD:main
